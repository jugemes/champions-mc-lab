name: Champions M-C Iteration 3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/iteration3.yml']
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SHOWDOWN_DIR: ${{ github.workspace }}/showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: 3a766f2cfb5e51c1e428cfe87d0dba91a8f01640
          path: showdown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd showdown && npm ci && npm run build
      - run: npm test && npm run check
      - run: node cycle3.js --per-case 2
      - run: node cycle3.js --per-case 75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle3-results
          path: output/cycle3/
