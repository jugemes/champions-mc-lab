name: M-8 readiness | M-C fixed-six 14-archetype baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'm8-baseline-core.js'
      - 'm8-preseason-benchmark.js'
      - 'test/m8-preseason-benchmark.test.js'
      - 'm8-counterfactual-selection.js'
      - 'test/m8-counterfactual-selection.test.js'
      - 'lab.js'
      - '.github/workflows/m8-preseason-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHOWDOWN_DIR: ${{ github.workspace }}/showdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: 3a766f2cfb5e51c1e428cfe87d0dba91a8f01640
          path: showdown
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showdown/package-lock.json
      - name: Pin Showdown and build
        run: |
          test "$(git -C showdown rev-parse HEAD)" = 3a766f2cfb5e51c1e428cfe87d0dba91a8f01640
          cd showdown
          npm ci
          npm run build
      - name: Check Champions M-C legality
        run: npm run check
      - name: Test baseline set consistency and scenario coverage
        run: node --test test/m8-preseason-benchmark.test.js test/m8-counterfactual-selection.test.js
      - name: Reproducible live-six all-14 matchup baseline
        run: node m8-preseason-benchmark.js | tee m8-run.log
      - name: Test preregistered trios across BOTH hypothetical rival threes
        run: node m8-counterfactual-selection.js | tee m8-counterfactual.log
      - name: Store per-match and per-threat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-preseason-mc-baseline-${{ github.run_id }}
          path: |
            output/m8-preseason/
            m8-run.log
            m8-counterfactual.log
          retention-days: 30
          if-no-files-found: warn
