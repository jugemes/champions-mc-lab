# Claude Code をIssueコメントから起動する（GitHub公式連携）
# 有効化前にAnthropic GitHub Appを接続し、Actions Secretをユーザー本人が登録すること。
# ChatGPTは別途GitHubにIssueを作り、登録されたユーザー権限で @claude コメントを行う。
# 既存のClaude Team Standard/Premiumシート利用枠のみを使用。追加API課金は利用しない。
# Teamの利用超過クレジットが無効になっていることを確認するまでマージしない。
name: Claude Code - on-demand hybrid review
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # パブリックrepoで第三者にClaudeの計算資源を起動されないよう、所有者コメント限定。
    if: ${{ github.event.comment.user.login == 'jugemes' && contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-hybrid-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v4
      - name: Run Claude Code on requested Issue or PR
        uses: anthropics/claude-code-action@v1
        with:
          # 既存Claude TeamシートをOAuthで認証。ANTHROPIC_API_KEYは使用禁止。
          # Team利用上限到達時には停止（管理画面の追加使用量クレジットを無効に）。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 12
