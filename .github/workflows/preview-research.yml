name: Champions M-C Real Six-Preview Pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-research.yml'
      - 'preview-opponents.js'
      - 'preview-policy.js'
      - 'optimize-preview.js'
      - 'test/preview.test.js'
      - 'lab.js'
  workflow_dispatch:
    inputs:
      matches_per_pair:
        description: 'Games per candidate x opponent six (250 means 50k across five rounds)'
        default: '250'
        type: choice
        options: ['2','10','50','250']

permissions:
  contents: read
concurrency:
  group: champions-mc-independent-preview
  cancel-in-progress: false

jobs:
  independent-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SHOWDOWN_DIR: ${{ github.workspace }}/showdown
      RESEARCH_SHOWDOWN_COMMIT: 3a766f2cfb5e51c1e428cfe87d0dba91a8f01640
      PER_CASE: ${{ inputs.matches_per_pair || '250' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: 3a766f2cfb5e51c1e428cfe87d0dba91a8f01640
          path: showdown
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showdown/package-lock.json
      - name: Build the fixed simulator
        run: |
          cd showdown
          npm ci
          npm run build
      - name: Verify engine, mechanics, legality, strategy tests
        run: |
          mkdir -p output
          git -C showdown rev-parse HEAD > output/showdown-commit.txt
          test "$(cat output/showdown-commit.txt)" = "$RESEARCH_SHOWDOWN_COMMIT"
          npm test
          npm run check
          node speed-probe.js
      - name: Independent previews preflight
        run: node optimize-preview.js --cycles 1 --per-case 2
      - name: Independent 6-show-3-pick five-cycle comparison
        run: node optimize-preview.js --cycles 5 --per-case "$PER_CASE"
      - name: Summary of real preview decisions (not ladder win rates)
        if: success()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const s=require('./output/preview-cycles/summary.json');
          console.log('# Independently selected six-to-three battle audit');
          console.log('- Pinned Showdown commit: '+s.engine);
          console.log('- Completed battles: '+s.games+'; no forced opponent picks');
          for(const r of s.rounds){
            console.log('## Cycle '+r.cycle);
            for(const v of r.results){
              const diversity=Object.fromEntries(Object.entries(v.distribution).map(([k,d])=>[
                k,{ownTriples:Object.keys(d.candidateSelections).length,
                   rivalTriples:Object.keys(d.opponentSelections).length}]));
              console.log('- '+v.variant+': heuristic '+(v.mean*100).toFixed(2)+'% (not ladder); selection variety '+JSON.stringify(diversity));
            }
          }
          console.log('**No ranked battle inference; challenger and opponent remain heuristic.**');
          NODE
      - name: Store full battle choices, seeds, selections, lineups, results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champions-independent-preview-${{ github.run_id }}
          path: |
            output/preview-cycles/
            output/showdown-commit.txt
          retention-days: 30
          if-no-files-found: warn
